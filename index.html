<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <script>
      (function() {
        var saved = localStorage.getItem('aoe4-guides-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = saved === 'dark' || (!saved && prefersDark);
        document.documentElement.classList.add('no-transition');
        document.documentElement.style.backgroundColor = isDark ? '#161A25' : '#E9EBEE';
        // Colours the title bar of the installed app. Set here rather than as a
        // static tag with a prefers-color-scheme media query, because the theme
        // toggle can override the system preference and only this line knows
        // the result. It goes stale if the user toggles without reloading.
        var themeColor = document.createElement('meta');
        themeColor.name = 'theme-color';
        themeColor.content = isDark ? '#161A25' : '#E9EBEE';
        document.head.appendChild(themeColor);
      })();
    </script>
    <link href='https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900|Material+Icons' rel="stylesheet">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <!-- iOS ignores the manifest icons and flattens transparency to black, so
         this one is its own file: opaque and full-bleed. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age of Empires IV Build Orders | AOE4 GUIDES</title>

    <!-- Meta Tags-->
    <meta name="description" content="Create and share build orders for Age of Empires IV. Export and use any build order with the Overlay Tool for AoE4.">

    <!-- No <link rel="canonical"> here on purpose. This one file is served for
         every route, so a hardcoded canonical would tell crawlers that every
         build order page is a duplicate of the homepage. The router injects the
         correct per-route canonical instead (see src/router/index.js).

         Build order pages are the exception and no longer rely on the router
         for it: scripts/prerender.mjs writes one file per public build with its
         own canonical baked in, so a crawler that runs no JavaScript still gets
         the right one. It strips this comment from those copies, where it would
         sit three lines above the very tag it says is absent. -->

    <!-- Facebook Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="AoE4 Guides">
    <meta property="og:url" content="https://aoe4guides.com">
    <meta property="og:title" content="Age of Empires IV Build Orders | AOE4 GUIDES">
    <meta property="og:description" content="Create and share build orders for Age of Empires IV. Export and use any build order with the Overlay Tool for AoE4.">
    <meta property="og:image" content="https://aoe4guides.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="AoE4 Guides - Age of Empires IV build orders">

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta property="twitter:domain" content="aoe4guides.com">
    <meta property="twitter:url" content="https://aoe4guides.com">
    <meta name="twitter:title" content="Age of Empires IV Build Orders | AOE4 GUIDES">
    <meta name="twitter:description" content="Create and share build orders for Age of Empires IV. Export and use any build order with the Overlay Tool for AoE4.">
    <meta name="twitter:image" content="https://aoe4guides.com/og-image.png">
    <meta name="twitter:image:alt" content="AoE4 Guides - Age of Empires IV build orders">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
