name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # Fails if any mdi-* icon used in src/ is missing from the tree-shaken
      # list in src/plugins/mdiIcons.js (would silently not render in prod).
      - run: npm run check:icons

      # Fails if an entry in src/composables/builds/icons/plurals.js no longer
      # matches an icon title. The icon JSON is regenerated upstream, so a
      # rename orphans the exception and it lapses back to the regular rule.
      - run: npm run check:plurals

      # Fails if the season list in seasonDefaultProvider.js leaves a day in no
      # season or two, which would surface only on a season's first day.
      - run: npm run check:seasons

      # Fails if the search index could contain an unlisted build (spec 039's
      # promise), if an empty index could replace a good one, or if the matcher
      # drifts from spec 043 (AND across title/author/civ, CJK, typo tolerance).
      - run: npm run check:search

      - run: npm run build
